<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppy Lovers Page</title>
</head>
<body>
    <header style="background-color: burlywood; color: white; text-align: center;">
        <h1>Puppy Lovers Page</h1>
    </header>
    <section style="text-align: center;">
        <img src="images.jpeg" alt="Puppies with their mother" style="width: 90%; border-radius: 10px;">
    </section>
    <section style="text-align: center; margin-top: 30px;">
        <div style="display: flex; justify-content: center; align-items: center; gap: 20px;">
             <img src="images (1).jpeg" alt="black puppy" style="width: 300px; height: 300px; border-radius: 10px; object-fit: cover;">
        <div style="background-color: burlywood; color: white; width: 300px; height: 300px; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-align: center;">
            <p>Life is to short to just have one dog</p>
        </div>
             <img src="images (2).jpeg" alt="small puppy" style="width: 300px; height: 300px; border-radius: 10px; object-fit: cover;">
        </div>
    </section>
    <h2 style="text-align: center; margin-top: 30px;">More Puppies</h2>
    <section style="display: flex; justify-content: center; gap: 30px; margin-bottom: 30px;">
        <img src="images (3).jpeg" alt="puppies" style="width: 350px; height: 350px; border-radius: 10px; object-fit: cover;">
        <img src="images (4).jpeg" alt="more puppies" style="width: 350px; height: 350px; border-radius: 10px; object-fit: cover;">
    </section>
    <footer style="background-color: burlywood; color: white; text-align: center; padding: 20px;">
        <p>Developed by: Bisrat Mulusew</p>
    </footer>
</body>
</html>
